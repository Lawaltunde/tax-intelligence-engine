# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=wealthsimple-atie

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5333/wealthsimple_atie
spring.datasource.username=${DB_USERNAME:lawaltunde}
spring.datasource.password=${DB_PASSWORD:REDACTED_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=false

# ── Spring AI ──────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:REDACTED_OPENAI_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.0

# ── ATIE custom properties ─────────────────────────────────────────────────────
atie.reconciliation.mismatch-threshold=100.0
atie.confidence.review-threshold=0.80
atie.risk.weights.income-mismatch=20
atie.risk.weights.missing-slip=15
atie.risk.weights.deduction-spike=25

# ── CRA Auto-fill My Return (AFR) integration ──────────────────────────────────
# mock-mode=true  → returns simulated data, no real CRA call (safe for dev/test)
# mock-mode=false → calls live CRA AFR API (requires NETFILE certification)
atie.cra.mock-mode=true
atie.cra.base-url=https://test.cra-arc.gc.ca/efile
atie.cra.transmitter-number=T99999999

# ── CORS ───────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins.
# Vite default (5173) and CRA/Next.js default (3000) are both included for dev.
# Override with the deployed frontend URL via environment variable in production.
atie.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.devlawal.wealthsimpleatie.ai=DEBUG
logging.level.com.devlawal.wealthsimpleatie.service=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── Jackson ────────────────────────────────────────────────────────────────────
# Serialise Instant as "2024-04-01T12:00:00Z" (ISO 8601) not as an epoch number.
# TypeScript Date / dayjs / date-fns all parse ISO 8601 natively.
spring.jackson.serialization.write-dates-as-timestamps=false
