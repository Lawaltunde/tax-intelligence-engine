name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       wealthsimple_atie
          POSTGRES_USER:     atie_user
          POSTGRES_PASSWORD: atie_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atie_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Use the CI postgres above; secrets supply the OpenAI key
      SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/wealthsimple_atie
      SPRING_DATASOURCE_USERNAME: atie_user
      SPRING_DATASOURCE_PASSWORD: atie_pass
      OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build & test
        run: ./mvnw -B verify

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22 / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
